<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YoutubeMentries</title>
<style>
  html, body { height: 100%; margin: 0; background: #0f0f0f; color: #f1f1f1;
               font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { display: grid; place-content: center; gap: .75rem; height: 100%; text-align: center; padding: 1.5rem; }
  a { color: #ff5c5c; }
</style>
<script>
  // GitHub Pages serves this file for any unknown path. The app itself routes
  // on the hash, so anything that lands here just needs sending back to the
  // app root with its path preserved as a hash route.
  (function () {
    var base = location.pathname.replace(/\/[^/]*$/, '/');
    var repoRoot = base.split('/').slice(0, 2).join('/') + '/';
    var rest = location.pathname.slice(repoRoot.length).replace(/^\/+/, '');
    var target = repoRoot + (location.search || '') + '#/' + rest;
    if (location.hash) target = repoRoot + '#' + location.hash.slice(1);
    location.replace(target);
  })();
</script>
</head>
<body>
<main>
  <h1>Taking you back…</h1>
  <p>If nothing happens, <a href="/">return to YoutubeMentries</a>.</p>
</main>
</body>
</html>
